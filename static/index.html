<!doctype html><html><head><meta charset="utf-8"><title>QZero — Support Triage</title>
<style>body{font:14px system-ui;margin:24px;background:#f7f7f8;color:#202124}h1{margin:0}.sub{color:#666}button,input{padding:9px;margin:4px 4px 12px 0}input{width:420px}section{background:#fff;padding:16px;margin:14px 0;border-radius:8px}.kpis{display:flex;gap:12px}.kpi{background:#eee;padding:12px;min-width:130px;border-radius:6px}.kpi b{display:block;font-size:22px}table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid #ddd;vertical-align:top}.critical{color:#b42318;font-weight:bold}.high{color:#c55a00;font-weight:bold}.medium{color:#8a6500;font-weight:bold}.low{color:#666}.reply{display:none;color:#444;max-width:400px}.expanded .reply{display:block}.alert{padding:8px;border-bottom:1px solid #ddd}.spike{background:#fff2d8}.synthetic{font-size:11px;color:#765}.pending{color:#777}.progress{margin:8px 0;padding:10px;background:#eef3ff}.bar{height:10px;background:#dbe3f4;border-radius:5px;overflow:hidden}.fill{height:100%;background:#316dca}</style></head><body>
<h1>QZero</h1><div class="sub">AI support-ticket triage · <span id="model"></span></div>
<section><div class="kpis" id="kpis"></div></section>
<section><button onclick="post('/api/eval')">Run 50-ticket eval</button><button onclick="post('/api/demo/burst')">Trigger spike burst</button><button onclick="post('/api/reset')">Reset</button><br><input id="ticket" placeholder="Paste a support ticket"><button onclick="submitTicket()">Submit ticket</button></section>
<section><h2>Alerts</h2><div id="alerts">No alerts.</div></section>
<section><h2>Live queue</h2><div id="progress" class="progress" hidden></div><table><thead><tr><th>Urgency</th><th>Category</th><th>Theme</th><th>Summary</th><th>Needs human</th><th>Suggested reply</th></tr></thead><tbody id="queue"></tbody></table></section>
<section id="eval"><h2>Evaluation</h2><div>Run the evaluation to see results.</div></section>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function post(url, body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)alert(await r.text());await refresh()}
function submitTicket(){let e=document.querySelector('#ticket');if(e.value.trim()){post('/api/tickets',{text:e.value});e.value=''}}
function pct(v){return (v*100).toFixed(1)+'%'}
function progressText(p){if(p.status==='rate_limit_wait')return `Waiting for rate limit, resumes in ${p.wait_seconds}s`;if(p.status==='stopped_daily_quota')return 'Stopped: daily quota reached';if(p.status==='done')return 'Done';return `${p.task==='eval'?'Eval':'Burst'}: ${p.done} / ${p.total} classified${p.eta_seconds?` · about ${Math.max(1,Math.round(p.eta_seconds/60))} min left`:''}`}
function render(s){document.querySelector('#model').textContent='Model: '+(s.model||'starting');const k=s.kpis;document.querySelector('#kpis').innerHTML=`<div class=kpi><b>${k.tickets_triaged}</b>tickets triaged</div><div class=kpi><b>${k.estimated_minutes_saved}</b>minutes saved*</div><div class=kpi><b>${k.critical_surfaced}</b>critical surfaced</div><div class=kpi><b>${k.spike_affected}</b>spike-affected tickets</div>`;
const p=s.progress,box=document.querySelector('#progress');box.hidden=p.status==='idle';if(!box.hidden){const percent=p.total?Math.round(p.done/p.total*100):100;box.innerHTML=`<b>${progressText(p)}</b><div class=bar><div class=fill style="width:${percent}%"></div></div>`}
document.querySelector('#alerts').innerHTML=s.alerts.length?s.alerts.map(a=>`<div class="alert ${a.type==='spike'?'spike':''}"><b>${esc(a.type)}</b> — ${esc(a.message)}</div>`).join(''):'No alerts.';
document.querySelector('#queue').innerHTML=s.queue.map(t=>`<tr onclick="this.classList.toggle('expanded')"><td class="${esc(t.urgency)}">${esc(t.urgency||t.status)}</td><td>${esc(t.category||'—')}</td><td>${esc(t.theme||'—')} ${t.source==='demo_burst'?'<span class=synthetic>synthetic demo data</span>':''}</td><td>${esc(t.summary||t.text)}</td><td>${t.needs_human===undefined?'—':t.needs_human?'yes':'no'}</td><td><span class=reply>${esc(t.suggested_reply||'Awaiting classification')}</span><span class="${t.status==='pending'?'pending':''}">${t.status==='pending'?'Awaiting classification':''}</span></td></tr>`).join('');
if(s.last_eval){let e=s.last_eval;document.querySelector('#eval').innerHTML=`<h2>Evaluation</h2><p>Category: <b>${pct(e.category_accuracy)}</b> · Urgency: <b>${pct(e.urgency_accuracy)}</b> · Exact: <b>${pct(e.exact_match)}</b> · ${e.total_time_seconds}s</p><table><tr><th>Category</th><th>Count</th><th>Correct</th><th>Accuracy</th></tr>${Object.entries(e.per_category).map(([n,x])=>`<tr><td>${n}</td><td>${x.count}</td><td>${x.correct}</td><td>${pct(x.accuracy)}</td></tr>`).join('')}</table><h3>Mismatches (${e.mismatches.length})</h3>${e.mismatches.map(x=>`<p>#${x.id}: expected ${x.expected.category}/${x.expected.urgency}, got ${x.predicted.category}/${x.predicted.urgency}<br>${esc(x.text)}</p>`).join('')}`}}
async function refresh(){try{render(await (await fetch('/api/state')).json())}catch(e){console.error(e)}}refresh();setInterval(refresh,2000);
</script></body></html>
